<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zuno — маркетплейс</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0a1a;--card:#171227;--card2:#221a3a;--line:#2e2450;
    --text:#efeaff;--muted:#9b8fc4;--accent:#8b5cf6;--accent2:#ec4899;
    --green:#34d399;--red:#fb7185;--yellow:#fbbf24;
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  a{color:var(--accent2);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;outline:none}
  input,textarea,select{font-family:inherit;outline:none}
  .hidden{display:none!important}
  svg.ic{width:18px;height:18px;display:inline-block;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .auth-wrap{max-width:420px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 20px 60px rgba(139,92,246,.15)}
  .auth-wrap .logo{font-size:34px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin-bottom:4px}
  .auth-wrap h1{font-size:22px;margin-bottom:6px;text-align:center}
  .auth-wrap p.sub{color:var(--muted);font-size:14px;margin-bottom:24px;text-align:center}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px}
  .field input:focus{border-color:var(--accent)}
  .btn{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:13px;border-radius:10px;font-size:15px;font-weight:600;transition:.15s}
  .btn:hover{filter:brightness(1.1)}
  .btn.sec{background:var(--card2);border:1px solid var(--line)}
  .switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:center}

  header{position:sticky;top:0;z-index:50;background:rgba(13,10,26,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo-h{font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .search{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px}
  .search:focus{border-color:var(--accent)}
  .hbtn{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;transition:.15s;position:relative;display:inline-flex;align-items:center;gap:6px}
  .hbtn:hover{background:var(--card2);border-color:var(--accent)}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}

  main{max-width:1280px;margin:0 auto;padding:20px}
  .hero{background:linear-gradient(120deg,#2a1a5c,#171227 70%);border:1px solid var(--line);border-radius:20px;padding:30px;margin-bottom:24px}
  .hero h2{font-size:26px;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:14px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .sort{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .prod{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s;display:flex;flex-direction:column;cursor:pointer}
  .prod:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 34px rgba(139,92,246,.22)}
  .prod .img{height:150px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#221a3a,#171227)}
  .prod .img svg{width:64px;height:64px;stroke:var(--accent2);stroke-width:1.4;fill:none}
  .prod .info{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px}
  .prod .cat{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px}
  .prod .name{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
  .prod .desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prod .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
  .prod .price{font-size:16px;font-weight:700;color:var(--green)}
  .prod .old{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:6px}
  .rate{font-size:12px;color:var(--yellow);display:inline-flex;align-items:center;gap:3px}
  .add{background:var(--accent);color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;transition:.15s}
  .add:hover{background:var(--accent2)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:26px;position:relative}
  .modal h3{font-size:20px;margin-bottom:16px;padding-right:30px}
  .modal .close{position:absolute;top:16px;right:18px;background:none;color:var(--muted);font-size:24px;line-height:1}
  .modal .field input,.modal .field textarea,.modal .field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:14px}
  .modal textarea{min-height:80px;resize:vertical}
  .row{display:flex;gap:12px}
  .row>*{flex:1}

  .profile-head{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
  .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
  .profile-head .meta h2{font-size:22px}
  .profile-head .meta p{color:var(--muted);font-size:14px}
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:10px 18px;border-radius:10px;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .tab.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty svg{width:56px;height:56px;stroke:var(--muted);fill:none;stroke-width:1.2;margin-bottom:12px}

  .cart-item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .ci-img{width:56px;height:56px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ci-img svg{width:30px;height:30px;stroke:var(--accent2);fill:none;stroke-width:1.5}
  .ci-info{flex:1;min-width:0}
  .ci-info h4{font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-info p{font-size:12px;color:var(--muted)}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:28px;height:28px;border-radius:8px;background:var(--card2);color:var(--text);font-size:16px}
  .qty span{min-width:24px;text-align:center;font-size:14px}
  .total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:16px 0;border-top:1px solid var(--line);margin-top:16px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:14px 22px;border-radius:12px;font-size:14px;transition:.3s;z-index:200;opacity:0}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .order-head{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted)}
  .order .status{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .status.paid{background:rgba(52,211,153,.15);color:var(--green)}
  .status.ship{background:rgba(251,191,36,.15);color:var(--yellow)}
  .order ul{list-style:none;font-size:13px;color:var(--muted)}
  .order ul li{padding:3px 0}
  .order .sum{margin-top:10px;font-size:15px;font-weight:700;color:var(--green)}

  .pay-card{background:linear-gradient(135deg,#2a1a5c,#171227);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  .pay-card .num{font-family:monospace;font-size:20px;letter-spacing:2px;margin:20px 0 12px}
  .pay-card .row2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
</style>
  </head>

<!-- AUTH -->
<div id="authScreen" class="auth-wrap">
  <div class="logo">Zuno</div>
  <h1 id="authTitle">Регистрация</h1>
  <p class="sub" id="authSub">Создайте аккаунт, чтобы покупать и продавать</p>
  <div class="field"><label>Имя пользователя</label><input id="authUser" placeholder="например, alex"></div>
  <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@mail.com"></div>
  <div class="field"><label>Пароль</label><input id="authPass" type="password" placeholder="••••••••"></div>
  <button class="btn" id="authBtn" onclick="doAuth()">Создать аккаунт</button>
  <div class="err" id="authErr"></div>
  <div class="switch" id="authSwitch">Уже есть аккаунт? <a href="#" onclick="toggleAuth();return false">Войти</a></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="logo-h">Zuno</div>
    <input class="search" id="search" placeholder="Поиск товаров..." oninput="renderCatalog()">
    <button class="hbtn" onclick="showTab('catalog')"><svg class="ic"><use href="#i-bag"/></svg>Каталог</button>
    <button class="hbtn" onclick="showTab('cart')"><svg class="ic"><use href="#i-cart"/></svg><span class="badge hidden" id="cartBadge">0</span></button>
    <button class="hbtn" onclick="showTab('profile')"><svg class="ic"><use href="#i-user"/></svg><span id="hUserName"></span></button>
    <button class="hbtn" onclick="logout()" title="Выйти"><svg class="ic"><use href="#i-door"/></svg></button>
  </header>
  <main>
    <section id="tab-catalog">
      <div class="hero">
        <h2>Привет, <span id="heroName"></span></h2>
        <p>100+ товаров в 10 категориях. Всё выдумано, оплата демонстрационная.</p>
      </div>
      <div class="filters" id="catFilters"></div>
      <div style="display:flex;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap">
        <span style="color:var(--muted);font-size:13px" id="countLabel"></span>
        <select class="sort" id="sortSel" onchange="renderCatalog()">
          <option value="pop">Популярные</option>
          <option value="cheap">Сначала дешёвые</option>
          <option value="exp">Сначала дорогие</option>
          <option value="rate">По рейтингу</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="tab-cart" class="hidden">
      <h2 style="margin-bottom:20px">Корзина</h2>
      <div id="cartList"></div>
      <div id="cartFooter" class="hidden">
        <div class="total"><span>Итого:</span><span id="cartTotal">0 ₽</span></div>
        <button class="btn" onclick="openPay()">Перейти к оплате</button>
      </div>
    </section>

    <section id="tab-profile" class="hidden">
      <div class="profile-head">
        <div class="avatar" id="avatar"></div>
        <div class="meta">
          <h2 id="pName"></h2>
          <p id="pEmail"></p>
          <p style="margin-top:6px">Баланс: <b style="color:var(--green)" id="pBalance">0 ₽</b></p>
        </div>
        <button class="hbtn" style="margin-left:auto" onclick="topUp()"><svg class="ic"><use href="#i-card"/></svg>Пополнить</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="orders" onclick="profileTab('orders')"><svg class="ic"><use href="#i-box"/></svg>Мои заказы</button>
        <button class="tab" data-tab="myprod" onclick="profileTab('myprod')"><svg class="ic"><use href="#i-tag"/></svg>Мои товары</button>
        <button class="tab" data-tab="addprod" onclick="profileTab('addprod')"><svg class="ic"><use href="#i-plus"/></svg>Добавить товар</button>
      </div>
      <div id="ptab-orders"></div>
      <div id="ptab-myprod" class="hidden"></div>
      <div id="ptab-addprod" class="hidden"></div>
    </section>
  </main>
</div>

    <script>
const CATS = ["Электроника","Одежда","Дом","Красота","Спорт","Игрушки","Книги","Продукты","Авто","Зоотовары"];
const CAT_ICON = {"Электроника":"i-phone","Одежда":"i-shirt","Дом":"i-home","Красота":"i-brush","Спорт":"i-ball","Игрушки":"i-shop","Книги":"i-book","Продукты":"i-cup","Авто":"i-car","Зоотовары":"i-paw"};

function genProducts(){
  const names={
    "Электроника":["Смартфон","Ноутбук","Наушники","Умные часы","Фотокамера","Монитор","Клавиатура","Мышь","Повербанк","Зарядка"],
    "Одежда":["Футболка","Джинсы","Платье","Кроссовки","Куртка","Кепка","Сумка","Очки"],
    "Дом":["Диван","Стол","Стул","Кровать","Лампа","Свеча","Подушка","Плед"],
    "Красота":["Крем","Шампунь","Мыло","Лак","Помада","Духи"],
    "Спорт":["Мяч","Ракетка","Гантели","Велосипед","Коврик","Скакалка"],
    "Игрушки":["Мишка","Кукла","Конструктор","Пазл","Машинка"],
    "Книги":["Роман","Учебник","Детектив","Фэнтези","Сборник"],
    "Продукты":["Яблоки","Шоколад","Кофе","Пицца","Чай"],
    "Авто":["Шины","Масло","Коврики","Держатель","Компрессор"],
    "Зоотовары":["Корм","Игрушка","Лежанка","Поводок","Миска"]
  };
  const arr=[];let id=1;
  CATS.forEach(cat=>{
    names[cat].forEach(base=>{
      const models=["Pro","Max","Plus","Lite","Ultra","Mini","Classic","Neo","Air","Prime"];
      const model=models[(id*7)%models.length];
      const price=Math.round((300+Math.random()*45000)/10)*10;
      const oldp=Math.random()>0.6?Math.round(price*(1.15+Math.random()*0.4)):0;
      const rate=(3.5+Math.random()*1.5).toFixed(1);
      const sales=Math.floor(Math.random()*5000);
      arr.push({
        id,cat,name:`${base} ${model} ${100+id}`,
        desc:`${base} в категории «${cat}». Отличное качество, гарантия, быстрая доставка.`,
        icon:CAT_ICON[cat],
        price,old:oldp,rate:+rate,sales,
        seller:"Zuno Official"
      });
      id++;
    });
  });
  return arr;
}

const LS={users:'zuno_users',session:'zuno_session',cart:'zuno_cart',orders:'zuno_orders',myprod:'zuno_myprod',balance:'zuno_balance'};
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

let products=load('zuno_products',null);
if(!products){products=genProducts();save('zuno_products',products);}

let users=load(LS.users,{});
let session=load(LS.session,null);
let cart=load(LS.cart,{});
let orders=load(LS.orders,{});
let myprod=load(LS.myprod,{});
let balance=load(LS.balance,{});
let isLogin=false;
let activeCat="Все";

function toggleAuth(){
  isLogin=!isLogin;
  document.getElementById('authTitle').textContent=isLogin?'Вход':'Регистрация';
  document.getElementById('authSub').textContent=isLogin?'Войдите, чтобы продолжить':'Создайте аккаунт, чтобы покупать и продавать';
  document.getElementById('authBtn').textContent=isLogin?'Войти':'Создать аккаунт';
  document.getElementById('authSwitch').innerHTML=isLogin
    ?'Нет аккаунта? <a href="#" onclick="toggleAuth();return false">Зарегистрироваться</a>'
    :'Уже есть аккаунт? <a href="#" onclick="toggleAuth();return false">Войти</a>';
  document.getElementById('authErr').textContent='';
}

function doAuth(){
  const u=document.getElementById('authUser').value.trim();
  const e=document.getElementById('authEmail').value.trim();
  const p=document.getElementById('authPass').value;
  const err=document.getElementById('authErr');
  err.textContent='';
  if(isLogin){
    if(!u||!p){err.textContent='Введите логин и пароль';return;}
    if(!users[u]||users[u].pass!==p){err.textContent='Неверный логин или пароль';return;}
    startSession(u);
  }else{
    if(u.length<3){err.textContent='Логин минимум 3 символа';return;}
    if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='Некорректный email';return;}
    if(p.length<4){err.textContent='Пароль минимум 4 символа';return;}
    if(users[u]){err.textContent='Такой логин уже занят';return;}
    users[u]={pass:p,email:e,created:Date.now()};
    save(LS.users,users);
    if(balance[u]===undefined){balance[u]=10000;save(LS.balance,balance);}
    startSession(u);
    toast('Аккаунт создан! Начислено 10 000 ₽ демо-баланса');
  }
}

function startSession(u){
  session=u;save(LS.session,u);
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}

function logout(){
  session=null;save(LS.session,null);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('authPass').value='';
}

function initApp(){
  document.getElementById('hUserName').textContent=session;
  document.getElementById('heroName').textContent=session;
  renderCats();renderCatalog();renderCart();renderProfile();
}

function renderCats(){
  const box=document.getElementById('catFilters');
  box.innerHTML=`<button class="chip ${activeCat==='Все'?'active':''}" onclick="setCat('Все')">Все</button>`+
    CATS.map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="setCat('${c}')"><svg class="ic"><use href="#${CAT_ICON[c]}"/></svg>${c}</button>`).join('');
}
function setCat(c){activeCat=c;renderCats();renderCatalog();}

function renderCatalog(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const sort=document.getElementById('sortSel').value;
  const all=[...products,...(myprod[session]||[])];
  let list=all.filter(p=>{
    if(activeCat!=='Все'&&p.cat!==activeCat)return false;
    if(q&&!(p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)))return false;
    return true;
  });
  if(sort==='cheap')list.sort((a,b)=>a.price-b.price);
  else if(sort==='exp')list.sort((a,b)=>b.price-a.price);
  else if(sort==='rate')list.sort((a,b)=>b.rate-a.rate);
  else list.sort((a,b)=>b.sales-a.sales);

  document.getElementById('countLabel').textContent=`Найдено: ${list.length}`;
  document.getElementById('grid').innerHTML=list.length?list.map(p=>`
    <div class="prod">
      <div class="img" onclick="openProduct(${p.id})"><svg><use href="#${p.icon}"/></svg></div>
      <div class="info">
        <div class="cat">${p.cat}</div>
        <div class="name" onclick="openProduct(${p.id})">${p.name}</div>
        <div class="desc">${p.desc}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="rate"><svg class="ic" style="width:12px;height:12px"><use href="#i-star"/></svg>${p.rate}</span>
          <span style="font-size:11px;color:var(--muted)">${p.sales} продаж</span>
        </div>
        <div class="bottom">
          <div><span class="price">${p.price.toLocaleString('ru')} ₽</span>${p.old?`<span class="old">${p.old.toLocaleString('ru')}</span>`:''}</div>
          <button class="add" onclick="addToCart(${p.id});event.stopPropagation()"><svg class="ic" style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
        </div>
      </div>
    </div>`).join(''):`<div class="empty" style="grid-column:1/-1"><svg><use href="#i-search"/></svg><p>Ничего не найдено</p></div>`;
}
    </script>
    <script>
function openProduct(id){
  const all=[...products,...(myprod[session]||[])];
  const p=all.find(x=>x.id===id);if(!p)return;
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <div style="text-align:center;margin-bottom:12px"><svg style="width:90px;height:90px;stroke:var(--accent2);fill:none;stroke-width:1.2"><use href="#${p.icon}"/></svg></div>
    <div style="color:var(--accent2);font-size:12px;text-transform:uppercase;text-align:center;margin-bottom:6px">${p.cat}</div>
    <h3 style="text-align:center">${p.name}</h3>
    <p style="color:var(--muted);text-align:center;margin-bottom:16px;font-size:14px">${p.desc}</p>
    <div style="display:flex;justify-content:space-around;text-align:center;padding:14px;background:var(--bg);border-radius:12px;margin-bottom:16px">
      <div><div style="color:var(--yellow);font-size:18px">${p.rate}</div><div style="font-size:11px;color:var(--muted)">Рейтинг</div></div>
      <div><div style="font-size:18px">${p.sales}</div><div style="font-size:11px;color:var(--muted)">Продаж</div></div>
      <div><div style="font-size:18px;color:var(--green)">${p.price.toLocaleString('ru')} ₽</div><div style="font-size:11px;color:var(--muted)">Цена</div></div>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Продавец: <b style="color:var(--text)">${p.seller||session}</b></p>
    <button class="btn" onclick="addToCart(${p.id});closeModal()">Добавить в корзину</button>
  `);
}

function addToCart(id){
  const all=[...products,...(myprod[session]||[])];
  const p=all.find(x=>x.id===id);if(!p)return;
  const key=`${p.seller||'Zuno'}:${p.id}`;
  if(!cart[key])cart[key]={...p,qty:0,key};
  cart[key].qty++;
  save(LS.cart,cart);renderCart();
  toast(`«${p.name}» добавлен в корзину`);
}
function changeQty(key,d){
  if(!cart[key])return;
  cart[key].qty+=d;
  if(cart[key].qty<=0)delete cart[key];
  save(LS.cart,cart);renderCart();
}
function cartArr(){return Object.values(cart);}
function cartSum(){return cartArr().reduce((s,i)=>s+i.price*i.qty,0);}

function renderCart(){
  const arr=cartArr();
  const badge=document.getElementById('cartBadge');
  const cnt=arr.reduce((s,i)=>s+i.qty,0);
  if(cnt>0){badge.textContent=cnt;badge.classList.remove('hidden');}else badge.classList.add('hidden');

  const list=document.getElementById('cartList');
  if(!arr.length){
    list.innerHTML=`<div class="empty"><svg><use href="#i-cart"/></svg><p>Корзина пуста</p></div>`;
    document.getElementById('cartFooter').classList.add('hidden');return;
  }
  document.getElementById('cartFooter').classList.remove('hidden');
  list.innerHTML=arr.map(i=>`
    <div class="cart-item">
      <div class="ci-img"><svg><use href="#${i.icon}"/></svg></div>
      <div class="ci-info"><h4>${i.name}</h4><p>${i.price.toLocaleString('ru')} ₽ × ${i.qty}</p></div>
      <div class="qty">
        <button onclick="changeQty('${i.key}',-1)"><svg class="ic" style="width:14px;height:14px"><use href="#i-min"/></svg></button>
        <span>${i.qty}</span>
        <button onclick="changeQty('${i.key}',1)"><svg class="ic" style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
      </div>
      <div style="font-weight:700;color:var(--green);min-width:90px;text-align:right">${(i.price*i.qty).toLocaleString('ru')} ₽</div>
    </div>`).join('');
  document.getElementById('cartTotal').textContent=cartSum().toLocaleString('ru')+' ₽';
}

function openPay(){
  if(!cartArr().length)return;
  const bal=balance[session]||0;
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>Оплата</h3>
    <div class="pay-card">
      <div style="font-size:12px;color:var(--muted)">ZUNO PAY · DEMO</div>
      <div class="num" id="cardNum">4242 4242 4242 4242</div>
      <div class="row2"><span id="cardName">${session.toUpperCase()}</span><span>12/29</span></div>
    </div>
    <div class="field"><label>Номер карты (любой)</label><input id="payNum" value="4242 4242 4242 4242" maxlength="19"></div>
    <div class="row">
      <div class="field"><label>Срок</label><input id="payExp" value="12/29" maxlength="5"></div>
      <div class="field"><label>CVV</label><input id="payCvv" value="123" maxlength="3"></div>
    </div>
    <div class="field"><label>Имя на карте</label><input id="payName" value="${session.toUpperCase()}"></div>
    <div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--muted)">
      Баланс: <b style="color:var(--green)">${bal.toLocaleString('ru')} ₽</b><br>
      К оплате: <b style="color:var(--green)">${cartSum().toLocaleString('ru')} ₽</b>
    </div>
    <button class="btn" onclick="confirmPay()">Оплатить ${cartSum().toLocaleString('ru')} ₽</button>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">Демонстрация. Реальные деньги не списываются.</p>
  `);
  document.getElementById('payNum').addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19);
    document.getElementById('cardNum').textContent=e.target.value||'•••• •••• •••• ••••';
  });
  document.getElementById('payName').addEventListener('input',e=>{
    document.getElementById('cardName').textContent=(e.target.value||'').toUpperCase()||'CARD HOLDER';
  });
}

function confirmPay(){
  const total=cartSum();const bal=balance[session]||0;
  if(bal<total){toast('Недостаточно средств. Пополните баланс.');return;}
  balance[session]=bal-total;save(LS.balance,balance);
  const order={id:'ZN-'+Date.now().toString().slice(-8),date:new Date().toLocaleString('ru'),
    items:cartArr().map(i=>({name:i.name,price:i.price,qty:i.qty,icon:i.icon})),total,status:'paid'};
  if(!orders[session])orders[session]=[];
  orders[session].unshift(order);save(LS.orders,orders);
  cart={};save(LS.cart,cart);
  renderCart();renderProfile();closeModal();
  showModal(`<button class="close" onclick="closeModal()">×</button>
    <div style="text-align:center;padding:20px 0">
      <svg style="width:80px;height:80px;stroke:var(--green);fill:none;stroke-width:1.5"><use href="#i-check"/></svg>
      <h3 style="margin:14px 0 6px">Оплата прошла!</h3>
      <p style="color:var(--muted);font-size:14px">Заказ ${order.id} на ${total.toLocaleString('ru')} ₽</p>
      <button class="btn" style="margin-top:16px" onclick="closeModal();showTab('profile');profileTab('orders')">Мои заказы</button>
    </div>`);
}

function topUp(){
  showModal(`<button class="close" onclick="closeModal()">×</button>
    <h3>Пополнить баланс</h3>
    <div class="field"><label>Сумма</label><input id="topSum" type="number" value="5000" min="1"></div>
    <div class="field"><label>Номер карты (любой)</label><input id="topNum" value="4242 4242 4242 4242" maxlength="19"></div>
    <div class="row">
      <div class="field"><label>Срок</label><input value="12/29" maxlength="5"></div>
      <div class="field"><label>CVV</label><input value="123" maxlength="3"></div>
    </div>
    <button class="btn" onclick="doTopUp()">Пополнить</button>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">Демонстрация.</p>`);
}
function doTopUp(){
  const s=+document.getElementById('topSum').value;
  if(!s||s<=0){toast('Введите сумму');return;}
  balance[session]=(balance[session]||0)+s;save(LS.balance,balance);
  renderProfile();closeModal();toast(`Баланс пополнен на ${s.toLocaleString('ru')} ₽`);
}

function renderProfile(){
  document.getElementById('avatar').textContent=session[0].toUpperCase();
  document.getElementById('pName').textContent=session;
  document.getElementById('pEmail').textContent=users[session].email;
  document.getElementById('pBalance').textContent=(balance[session]||0).toLocaleString('ru')+' ₽';
  renderOrders();renderMyProd();renderAddProd();
}

function profileTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  ['orders','myprod','addprod'].forEach(x=>document.getElementById('ptab-'+x).classList.toggle('hidden',x!==t));
}

function renderOrders(){
  const arr=orders[session]||[];
  document.getElementById('ptab-orders').innerHTML=arr.length?arr.map(o=>`
    <div class="order">
      <div class="order-head"><span>${o.id} · ${o.date}</span><span class="status ${o.status}">Оплачен</span></div>
      <ul>${o.items.map(i=>`<li>${i.name} × ${i.qty} — ${(i.price*i.qty).toLocaleString('ru')} ₽</li>`).join('')}</ul>
      <div class="sum">Итого: ${o.total.toLocaleString('ru')} ₽</div>
    </div>`).join(''):`<div class="empty"><svg><use href="#i-box"/></svg><p>Заказов пока нет</p></div>`;
}

function renderMyProd(){
  const arr=myprod[session]||[];
  document.getElementById('ptab-myprod').innerHTML=arr.length?`<div class="grid">${arr.map(p=>`
    <div class="prod">
      <div class="img"><svg><use href="#${p.icon}"/></svg></div>
      <div class="info">
        <div class="cat">${p.cat}</div>
        <div class="name">${p.name}</div>
        <div class="desc">${p.desc}</div>
        <div class="bottom"><span class="price">${p.price.toLocaleString('ru')} ₽</span></div>
      </div>
    </div>`).join('')}</div>`:`<div class="empty"><svg><use href="#i-tag"/></svg><p>Вы ещё ничего не выставили</p></div>`;
}

function renderAddProd(){
  document.getElementById('ptab-addprod').innerHTML=`
    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:520px">
      <div class="field"><label>Название</label><input id="npName" placeholder="Например: Смартфон Zuno X"></div>
      <div class="field"><label>Категория</label><select id="npCat" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text)">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Описание</label><textarea id="npDesc" placeholder="Короткое описание"></textarea></div>
      <div class="row">
        <div class="field"><label>Цена, ₽</label><input id="npPrice" type="number" min="1" placeholder="1000"></div>
        <div class="field"><label>Старая цена (необязательно)</label><input id="npOld" type="number" min="0" placeholder="0"></div>
      </div>
      <button class="btn" onclick="addMyProd()">Выставить на продажу</button>
    </div>`;
}

function addMyProd(){
  const name=document.getElementById('npName').value.trim();
  const cat=document.getElementById('npCat').value;
  const desc=document.getElementById('npDesc').value.trim()||`Товар в категории «${cat}».`;
  const price=+document.getElementById('npPrice').value;
  const old=+document.getElementById('npOld').value||0;
  if(name.length<3){toast('Название минимум 3 символа');return;}
  if(!price||price<=0){toast('Укажите цену');return;}
  if(!myprod[session])myprod[session]=[];
  const id=Date.now();
  myprod[session].unshift({id,cat,name,desc,icon:CAT_ICON[cat],price,old,rate:5,sales:0,seller:session});
  save(LS.myprod,myprod);
  renderMyProd();renderCatalog();profileTab('myprod');
  toast('Товар выставлен на продажу');
}

function showModal(html){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

function showTab(t){
  ['catalog','cart','profile'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hidden',x!==t));
}

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

/* авто-вход */
if(session&&users[session]){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}
</script>
</body>
</html>
