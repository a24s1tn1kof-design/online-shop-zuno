<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Zuno — маркетплейс</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0a1a;--card:#171227;--card2:#221a3a;--line:#2e2450;--text:#efeaff;--muted:#9b8fc4;--accent:#8b5cf6;--accent2:#ec4899;--green:#34d399;--red:#fb7185;--yellow:#fbbf24}
html,body{overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
a{color:var(--accent2);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;outline:none;max-width:100%}
.hidden{display:none!important}
svg.ic{width:20px;height:20px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
img{max-width:100%;display:block}

/* AUTH */
.auth-wrap{max-width:420px;margin:6vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:calc(100% - 32px)}
.auth-wrap .logo{font-size:32px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin-bottom:4px}
.auth-wrap h1{font-size:20px;margin-bottom:6px;text-align:center}
.auth-wrap p.sub{color:var(--muted);font-size:13px;margin-bottom:22px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.btn{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:13px;border-radius:10px;font-size:15px;font-weight:600}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:center}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:rgba(13,10,26,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px}
.head-top{display:flex;align-items:center;gap:10px}
.logo-h{font-size:22px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.search{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px}
.search:focus{border-color:var(--accent)}

main{max-width:1280px;margin:0 auto;padding:14px}

/* HERO */
.hero{background:linear-gradient(120deg,#2a1a5c,#171227 70%);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.hero h2{font-size:20px;margin-bottom:4px}
.hero p{color:var(--muted);font-size:13px}

/* FILTERS */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.chip.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}

.cat-head{display:flex;align-items:center;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.cat-head h2{font-size:17px;font-weight:700}
.cat-head .count{color:var(--muted);font-size:13px;font-weight:400}
.sort{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}

/* PRODUCT CARD */
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.prod:active{border-color:var(--accent)}
.prod .img{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#221a3a,#171227);position:relative;overflow:hidden}
.prod .img .ph{width:100%;height:100%;object-fit:cover}
.prod .img svg{width:55%;height:55%;max-width:80px;stroke:var(--accent2);stroke-width:1.3;fill:none}
.prod .disc{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.prod .info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .name{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.prod .price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.prod .price{font-size:15px;font-weight:800}
.prod .old{font-size:11px;color:var(--muted);text-decoration:line-through}
.prod .rate{font-size:11px;color:var(--yellow);display:inline-flex;align-items:center;gap:3px}
.prod .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;gap:6px}
.prod .btn-cart{background:var(--accent);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,10,26,.98);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:60}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:4px 14px;position:relative}
.bn-item.active{color:var(--accent2)}
.bn-item .badge{position:absolute;top:0;right:6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}

/* CART */
.cart-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.ci-img{width:60px;height:60px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-img svg{width:34px;height:34px;stroke:var(--accent2);fill:none;stroke-width:1.5}
.ci-info{flex:1;min-width:0}
.ci-info h4{font-size:13px;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ci-info .ci-price{font-size:14px;font-weight:700;color:var(--green)}
.ci-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.qty{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:20px;padding:3px}
.qty button{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.qty span{min-width:20px;text-align:center;font-size:13px;font-weight:600}

.cart-bar{position:fixed;bottom:64px;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px;z-index:55;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.cart-bar .sum{flex:1;font-size:12px;color:var(--muted)}
.cart-bar .sum b{display:block;font-size:18px;color:var(--text);font-weight:800}
.cart-bar .btn{width:auto;padding:12px 22px;font-size:14px;flex-shrink:0}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));position:relative}
@media(min-width:640px){.modal{border-radius:20px}}
.modal h3{font-size:18px;margin-bottom:16px;padding-right:30px}
.modal .close{position:absolute;top:14px;right:16px;background:var(--card2);color:var(--text);font-size:20px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1}

/* PAY CARD */
.pay-card{background:linear-gradient(135deg,#2a1a5c,#171227);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.pay-card .lbl{font-size:11px;color:var(--muted);letter-spacing:1px}
.pay-card .num{font-family:monospace;font-size:17px;letter-spacing:1.5px;margin:18px 0 12px;word-break:break-all}
.pay-card .row2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:10px}
.pay-card .row2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PROFILE */
.profile-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
.profile-head .meta{min-width:0;flex:1}
.profile-head .meta h2{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-head .meta p{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-head .meta .bal{margin-top:4px;font-size:13px}
.profile-head .meta .bal b{color:var(--green);font-size:15px}

.pm-list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pm-row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);cursor:pointer}
.pm-row:last-child{border-bottom:none}
.pm-row:active{background:var(--card2)}
.pm-row .pm-ic{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--accent2);flex-shrink:0}
.pm-row .pm-txt{flex:1;font-size:14px;font-weight:500}
.pm-row .pm-arrow{color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty svg{width:52px;height:52px;stroke:var(--muted);fill:none;stroke-width:1.2;margin:0 auto 12px;opacity:.6}
.empty p{font-size:14px}

/* ORDERS */
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.order-head{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--muted);gap:10px;flex-wrap:wrap}
.order .status{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(52,211,153,.15);color:var(--green)}
.order ul{list-style:none;font-size:13px;color:var(--muted)}
.order ul li{padding:3px 0;overflow:hidden;text-overflow:ellipsis}
.order .sum{margin-top:10px;font-size:14px;font-weight:700;color:var(--green)}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:12px;font-size:13px;transition:.3s;z-index:200;opacity:0;max-width:90vw;display:flex;align-items:center;gap:10px;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2;flex-shrink:0}
.toast.warn svg{stroke:var(--yellow)}

/* BACK */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:14px;cursor:pointer}
.back:hover{color:var(--text)}

/* PRODUCT PAGE */
.pp-img{aspect-ratio:1/1;max-height:340px;background:linear-gradient(135deg,#221a3a,#171227);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:16px;border:1px solid var(--line)}
.pp-img img{width:100%;height:100%;object-fit:cover}
.pp-img svg{width:45%;height:45%;stroke:var(--accent2);stroke-width:1.2;fill:none}
.pp-name{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.pp-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pp-price{font-size:26px;font-weight:800;color:var(--green)}
.pp-old{font-size:15px;color:var(--muted);text-decoration:line-through}
.pp-disc{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.pp-meta{display:flex;gap:16px;margin-bottom:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pp-meta b{color:var(--text)}
.pp-seller{background:var(--card2);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:16px}
.pp-seller b{color:var(--text)}
.pp-actions{display:flex;gap:10px;margin-bottom:22px;position:sticky;bottom:80px;background:var(--bg);padding:8px 0;z-index:5}
.pp-actions .btn{flex:1}
.pp-actions .fav{width:52px;flex:0 0 52px;background:var(--card2);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pp-actions .fav.on{color:var(--red);border-color:var(--red)}

.tabs2{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tab2{padding:11px 16px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab2.active{color:var(--text);border-color:var(--accent2)}

/* REVIEWS / QA */
.review{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.review .rev-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.review .rev-head .who{font-weight:600}
.review .rev-head .when{color:var(--muted);font-size:11px;margin-left:auto}
.review .stars{color:var(--yellow);font-size:12px;letter-spacing:1px}
.review .rev-txt{font-size:13px;color:var(--muted);line-height:1.45;word-break:break-word}

.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.qa .q{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;gap:8px}
.qa .a{font-size:13px;color:var(--muted);padding-left:22px;border-left:2px solid var(--accent);margin-left:6px;line-height:1.45}
.qa .a b{color:var(--accent2)}

.star-pick{display:flex;gap:4px;font-size:24px;color:var(--muted);cursor:pointer;margin-bottom:10px}
.star-pick .on{color:var(--yellow)}
</style>
</head>

<!-- AUTH -->

        </div>

      </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"><svg><use href="#i-check"/></svg><span id="toastTxt"></span></div>

<script>
 /* ================= ДАННЫЕ ================= */
const CATS=["Электроника","Одежда","Дом","Красота","Спорт","Игрушки","Книги","Продукты","Авто","Зоотовары"];
const CAT_ICON={"Электроника":"i-phone","Одежда":"i-shirt","Дом":"i-home2","Красота":"i-brush","Спорт":"i-ball","Игрушки":"i-shop","Книги":"i-book","Продукты":"i-cup","Авто":"i-car","Зоотовары":"i-paw"};
const PHOTOS={
  "Электроника":["https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&q=70","https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400&q=70","https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=70","https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400&q=70"],
  "Одежда":["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=70","https://images.unsplash.com/photo-1542272604-787c3835535d?w=400&q=70","https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400&q=70","https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=70"],
  "Дом":["https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400&q=70","https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=400&q=70","https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=400&q=70"],
  "Красота":["https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400&q=70","https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&q=70"],
  "Спорт":["https://images.unsplash.com/photo-1517649763962-0c623066013b?w=400&q=70","https://images.unsplash.com/photo-1546519638-68e109498ffc?w=400&q=70"],
  "Игрушки":["https://images.unsplash.com/photo-1558877385-81a1c7e67d72?w=400&q=70","https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=400&q=70"],
  "Книги":["https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&q=70","https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=70"],
  "Продукты":["https://images.unsplash.com/photo-1519996529931-28324d5a630e?w=400&q=70","https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=70"],
  "Авто":["https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=400&q=70","https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400&q=70"],
  "Зоотовары":["https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=400&q=70","https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400&q=70"]
};
const NAMES={
  "Электроника":["Смартфон","Ноутбук","Наушники","Умные часы","Фотокамера","Монитор","Клавиатура","Мышь","Повербанк","Зарядка"],
  "Одежда":["Футболка","Джинсы","Платье","Кроссовки","Куртка","Кепка","Сумка","Очки"],
  "Дом":["Диван","Стол","Стул","Кровать","Лампа","Свеча","Подушка","Плед"],
  "Красота":["Крем","Шампунь","Мыло","Лак","Помада","Духи"],
  "Спорт":["Мяч","Ракетка","Гантели","Велосипед","Коврик","Скакалка"],
  "Игрушки":["Мишка","Кукла","Конструктор","Пазл","Машинка"],
  "Книги":["Роман","Учебник","Детектив","Фэнтези","Сборник"],
  "Продукты":["Яблоки","Шоколад","Кофе","Пицца","Чай"],
  "Авто":["Шины","Масло","Коврики","Держатель","Компрессор"],
  "Зоотовары":["Корм","Игрушка","Лежанка","Поводок","Миска"]
};
const REVIEW_NAMES=["Артём","Мария","Иван","Ольга","Дмитрий","Анна","Сергей","Екатерина","Павел","Юлия"];
const REVIEW_TEXTS=["Отличный товар, всё пришло быстро.","Качество на высоте, рекомендую.","Соответствует описанию, доволен покупкой.","Хорошо упаковано, спасибо.","Взял второй раз, всё ок.","Нормально, но ждал дольше.","Приятно удивлён качеством.","Как на картинке, продавец молодец."];
const Q_TEXTS=["Есть ли гарантия?","Какой срок доставки?","Товар оригинальный?","Есть ли скидка при покупке двух?","Какой цвет в наличии?","Работает от сети 220В?"];
const A_TEXTS=["Да, гарантия 12 месяцев.","Доставка 2-5 дней по городу.","Да, только оригинал.","Да, при покупке от 2 шт — скидка 10%.","Все цвета есть в наличии.","Да, работает от стандартной сети."];

function pick(a,i){return a[i%a.length]}

function genProducts(){
  const arr=[];let id=1;
  CATS.forEach(cat=>{
    NAMES[cat].forEach((base,bi)=>{
      const models=["Pro","Max","Plus","Lite","Ultra","Mini","Classic","Neo","Air","Prime"];
      const price=Math.round((300+Math.random()*45000)/10)*10;
      const oldp=Math.random()>0.6?Math.round(price*(1.15+Math.random()*0.4)):0;
      const rate=+(3.5+Math.random()*1.5).toFixed(1);
      const sales=Math.floor(Math.random()*5000);
      const photos=PHOTOS[cat]||[];
      const img=photos.length?pick(photos,id):"";
      const reviews=Array.from({length:2+Math.floor(Math.random()*3)},(_,k)=>({
        who:pick(REVIEW_NAMES,id+k),rate:4+((id+k)%2),when:`${1+(id+k)%28}.0${1+(id+k)%9}.2025`,
        text:pick(REVIEW_TEXTS,id+k)
      }));
      const questions=Array.from({length:1+Math.floor(Math.random()*2)},(_,k)=>({
        q:pick(Q_TEXTS,id+k+bi),a:pick(A_TEXTS,id+k+bi),who:pick(REVIEW_NAMES,id+k+3)
      }));
      arr.push({
        id,cat,name:`${base} ${pick(models,id)} ${100+id}`,
        desc:`${base} в категории «${cat}». Отличное качество, гарантия и быстрая доставка. Подходит для повседневного использования.`,
        icon:CAT_ICON[cat],img,price,old:oldp,rate,sales,seller:"Zuno Official",
        reviews,questions
      });
      id++;
    });
  });
  return arr;
}

/* ================= ХРАНИЛИЩЕ ================= */
const LS={users:'zuno_users',session:'zuno_session',cart:'zuno_cart',orders:'zuno_orders',myprod:'zuno_myprod',balance:'zuno_balance',fav:'zuno_fav'};
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

let products=load('zuno_products',null);
if(!products){products=genProducts();save('zuno_products',products);}
let users=load(LS.users,{});
let session=load(LS.session,null);
let cart=load(LS.cart,{});
let orders=load(LS.orders,{});
let myprod=load(LS.myprod,{});
let balance=load(LS.balance,{});
let fav=load(LS.fav,{});
let isLogin=false;
let activeCat="Все";
let prevTab="catalog";

/* ================= АВТОРИЗАЦИЯ ================= */
function toggleAuth(){
  isLogin=!isLogin;
  document.getElementById('authTitle').textContent=isLogin?'Вход':'Регистрация';
  document.getElementById('authSub').textContent=isLogin?'Войдите, чтобы продолжить':'Создайте аккаунт для покупок и продаж';
  document.getElementById('authBtn').textContent=isLogin?'Войти':'Создать аккаунт';
  document.getElementById('authSwitch').innerHTML=isLogin
    ?'Нет аккаунта? <a href="#" onclick="toggleAuth();return false">Зарегистрироваться</a>'
    :'Уже есть аккаунт? <a href="#" onclick="toggleAuth();return false">Войти</a>';
  document.getElementById('authErr').textContent='';
}
function doAuth(){
  const u=document.getElementById('authUser').value.trim();
  const e=document.getElementById('authEmail').value.trim();
  const p=document.getElementById('authPass').value;
  const err=document.getElementById('authErr');err.textContent='';
  if(isLogin){
    if(!u||!p){err.textContent='Введите логин и пароль';return;}
    if(!users[u]||users[u].pass!==p){err.textContent='Неверный логин или пароль';return;}
    startSession(u);
  }else{
    if(u.length<3){err.textContent='Логин минимум 3 символа';return;}
    if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='Некорректный email';return;}
    if(p.length<4){err.textContent='Пароль минимум 4 символа';return;}
    if(users[u]){err.textContent='Такой логин уже занят';return;}
    users[u]={pass:p,email:e,created:Date.now()};save(LS.users,users);
    if(balance[u]===undefined){balance[u]=10000;save(LS.balance,balance);}
    startSession(u);
    toast('Аккаунт создан, на баланс зачислено 10 000 ₽');
  }
}
function startSession(u){
  session=u;save(LS.session,u);
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}
function logout(){
  session=null;save(LS.session,null);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('authPass').value='';
}
function initApp(){
  document.getElementById('heroName').textContent=session;
  document.getElementById('npCat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
  renderBottomNav();
  renderCats();
  renderCatalog();
  renderCart();
  renderProfile();
}

/* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
function renderBottomNav(){
  const cnt=Object.values(cart).reduce((s,i)=>s+i.qty,0);
  const badge=cnt>0?`<span class="badge">${cnt}</span>`:'';
  const favCnt=(fav[session]||[]).length;
  const favBadge=favCnt>0?`<span class="badge">${favCnt}</span>`:'';
  const currentTab=['catalog','cart','fav','profile'].includes(activeTabNow())?activeTabNow():'catalog';
  document.getElementById('bottomNav').innerHTML=`
    <button class="bn-item ${currentTab==='catalog'?'active':''}" onclick="showTab('catalog')">
      <svg class="ic"><use href="#i-home2"/></svg><span>Главная</span>
    </button>
    <button class="bn-item ${currentTab==='cart'?'active':''}" onclick="showTab('cart')">
      <svg class="ic"><use href="#i-cart"/></svg>${badge}<span>Корзина</span>
    </button>
    <button class="bn-item ${currentTab==='fav'?'active':''}" onclick="showTab('fav')">
      <svg class="ic"><use href="#i-heart"/></svg>${favBadge}<span>Избранное</span>
    </button>
    <button class="bn-item ${currentTab==='profile'?'active':''}" onclick="showTab('profile')">
      <svg class="ic"><use href="#i-user"/></svg><span>Профиль</span>
    </button>`;
}
function activeTabNow(){
  for(const t of ['catalog','cart','fav','profile','orders','myprod','addprod','product']){
    const el=document.getElementById('tab-'+t);
    if(el&&!el.classList.contains('hidden'))return t;
  }
  return 'catalog';
 }
 /* ================= КАТАЛОГ ================= */
function renderCats(){
  const box=document.getElementById('catFilters');
  box.innerHTML=`<button class="chip ${activeCat==='Все'?'active':''}" onclick="setCat('Все')">Все</button>`+
    CATS.map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="setCat('${c}')"><svg class="ic" style="width:16px;height:16px"><use href="#${CAT_ICON[c]}"/></svg>${c}</button>`).join('');
}
function setCat(c){
  activeCat=c;renderCats();
  document.getElementById('catTitle').textContent=c==='Все'?'Все товары':c;
  renderCatalog();
}
function productImgBlock(p){
  if(p.img)return `<img src="${p.img}" alt="" loading="lazy" onerror="this.outerHTML='<svg style=&quot;width:45%;height:45%;stroke:var(--accent2);stroke-width:1.2;fill:none&quot;><use href=&quot;#${p.icon}&quot;/></svg>'">`;
  return `<svg><use href="#${p.icon}"/></svg>`;
}
function renderCatalog(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const sort=document.getElementById('sortSel').value;
  const all=[...products,...(myprod[session]||[])];
  let list=all.filter(p=>{
    if(activeCat!=='Все'&&p.cat!==activeCat)return false;
    if(q&&!(p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)))return false;
    return true;
  });
  if(sort==='cheap')list.sort((a,b)=>a.price-b.price);
  else if(sort==='exp')list.sort((a,b)=>b.price-a.price);
  else if(sort==='rate')list.sort((a,b)=>b.rate-a.rate);
  else list.sort((a,b)=>b.sales-a.sales);

  document.getElementById('countLabel').textContent=`${list.length} товаров`;
  document.getElementById('grid').innerHTML=list.length?list.map(p=>{
    const disc=p.old?Math.round((1-p.price/p.old)*100):0;
    return `
    <div class="prod" onclick="openProduct(${p.id})">
      <div class="img">${productImgBlock(p)}${disc>0?`<span class="disc">-${disc}%</span>`:''}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price-row">
          <span class="price">${p.price.toLocaleString('ru')} ₽</span>
          ${p.old?`<span class="old">${p.old.toLocaleString('ru')} ₽</span>`:''}
        </div>
        <span class="rate"><svg class="ic" style="width:11px;height:11px"><use href="#i-star"/></svg>${p.rate} · ${p.sales}</span>
        <div class="bottom">
          <span style="font-size:11px;color:var(--muted)">${p.cat}</span>
          <button class="btn-cart" onclick="event.stopPropagation();addToCart(${p.id})">
            <svg class="ic" style="width:14px;height:14px"><use href="#i-cart"/></svg>В корзину
          </button>
        </div>
      </div>
    </div>`}).join(''):`<div class="empty" style="grid-column:1/-1"><svg><use href="#i-search"/></svg><p>Ничего не найдено</p></div>`;
}

/* ================= СТРАНИЦА ТОВАРА ================= */
function openProduct(id){
  const all=[...products,...(myprod[session]||[])];
  const p=all.find(x=>x.id===id);if(!p)return;
  prevTab=activeTabNow()==='product'?'catalog':activeTabNow();
  const disc=p.old?Math.round((1-p.price/p.old)*100):0;
  const revs=p.reviews||[];
  const qs=p.questions||[];
  const favs=fav[session]||[];
  const isFav=favs.includes(p.id);
  const avg=revs.length?(revs.reduce((s,r)=>s+r.rate,0)/revs.length).toFixed(1):p.rate;

  document.getElementById('productView').innerHTML=`
    <div class="pp-img">${productImgBlock(p)}</div>
    <div class="pp-name">${p.name}</div>
    <div class="pp-price-row">
      <span class="pp-price">${p.price.toLocaleString('ru')} ₽</span>
      ${p.old?`<span class="pp-old">${p.old.toLocaleString('ru')} ₽</span>`:''}
      ${disc>0?`<span class="pp-disc">-${disc}%</span>`:''}
    </div>
    <div class="pp-meta">
      <span><svg class="ic" style="width:14px;height:14px;color:var(--yellow)"><use href="#i-star"/></svg> <b>${avg}</b> · ${revs.length} отзывов</span>
      <span><svg class="ic" style="width:14px;height:14px"><use href="#i-box"/></svg> ${p.sales} продаж</span>
      <span><svg class="ic" style="width:14px;height:14px"><use href="#i-truck"/></svg> 2-5 дней</span>
    </div>
    <div class="pp-seller">
      <svg class="ic" style="width:14px;height:14px;vertical-align:-2px"><use href="#i-shop"/></svg>
      Продавец: <b>${p.seller||session}</b> · Категория: <b>${p.cat}</b>
    </div>
    <div class="pp-actions">
      <button class="btn" onclick="addToCart(${p.id})">Добавить в корзину</button>
      <button class="fav ${isFav?'on':''}" onclick="toggleFav(${p.id})"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>

    <div class="tabs2">
      <button class="tab2 active" data-pt="desc" onclick="ptab('desc')">Описание</button>
      <button class="tab2" data-pt="rev" onclick="ptab('rev')">Отзывы (${revs.length})</button>
      <button class="tab2" data-pt="qa" onclick="ptab('qa')">Вопросы (${qs.length})</button>
    </div>

    <div id="ptab-desc">
      <p style="font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:18px">${p.desc}</p>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--muted);line-height:1.8">
        <div><b style="color:var(--text)">Категория:</b> ${p.cat}</div>
        <div><b style="color:var(--text)">Продавец:</b> ${p.seller||session}</div>
        <div><b style="color:var(--text)">Доставка:</b> 2-5 рабочих дней</div>
        <div><b style="color:var(--text)">Оплата:</b> картой онлайн</div>
      </div>
    </div>

    <div id="ptab-rev" class="hidden">
      ${revs.length?revs.map(r=>`
        <div class="review">
          <div class="rev-head">
            <span class="who">${r.who}</span>
            <span class="stars">${'★'.repeat(r.rate)}${'☆'.repeat(5-r.rate)}</span>
            <span class="when">${r.when}</span>
          </div>
          <div class="rev-txt">${r.text}</div>
        </div>`).join(''):'<div class="empty"><svg><use href="#i-msg"/></svg><p>Пока нет отзывов</p></div>'}
      <button class="btn" style="margin-top:10px" onclick="openReview(${p.id})">Написать отзыв</button>
    </div>

    <div id="ptab-qa" class="hidden">
      ${qs.length?qs.map(x=>`
        <div class="qa">
          <div class="q"><svg class="ic" style="width:14px;height:14px;color:var(--accent2)"><use href="#i-msg"/></svg>${x.q}</div>
          <div class="a"><b>${x.who||'Продавец'}:</b> ${x.a}</div>
        </div>`).join(''):'<div class="empty"><svg><use href="#i-msg"/></svg><p>Пока нет вопросов</p></div>'}
      <button class="btn" style="margin-top:10px" onclick="openQuestion(${p.id})">Задать вопрос</button>
    </div>
  `;
  showTab('product');
}
function ptab(t){
  document.querySelectorAll('.tab2').forEach(b=>b.classList.toggle('active',b.dataset.pt===t));
  ['desc','rev','qa'].forEach(x=>document.getElementById('ptab-'+x).classList.toggle('hidden',x!==t));
}

/* ================= ОТЗЫВЫ И ВОПРОСЫ ================= */
function openReview(id){
  let stars=5;
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>Написать отзыв</h3>
    <div class="star-pick" id="starPick">
      ${[1,2,3,4,5].map(i=>`<span data-s="${i}" class="${i<=stars?'on':''}" onclick="pickStar(${i})">★</span>`).join('')}
    </div>
    <div class="field"><label>Комментарий</label><textarea id="revText" placeholder="Поделитесь впечатлением" style="min-height:100px;resize:vertical"></textarea></div>
    <button class="btn" onclick="submitReview(${id})">Отправить</button>
  `);
  window.__star=stars;
}
function pickStar(n){
  window.__star=n;
  document.querySelectorAll('#starPick span').forEach(s=>s.classList.toggle('on',+s.dataset.s<=n));
}
function submitReview(id){
  const text=document.getElementById('revText').value.trim();
  if(!text){toast('Напишите комментарий',true);return;}
  const all=[...products,...(myprod[session]||[])];
  const p=all.find(x=>x.id===id);if(!p)return;
  p.reviews=p.reviews||[];
  p.reviews.unshift({who:session,rate:window.__star||5,when:new Date().toLocaleDateString('ru'),text});
  save('zuno_products',products);
  if(myprod[session]){save(LS.myprod,myprod);}
  closeModal();openProduct(id);toast('Отзыв добавлен');
}
function openQuestion(id){
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>Задать вопрос</h3>
    <div class="field"><label>Ваш вопрос</label><textarea id="qText" placeholder="Например: есть ли гарантия?" style="min-height:100px;resize:vertical"></textarea></div>
    <button class="btn" onclick="submitQuestion(${id})">Отправить</button>
  `);
}
function submitQuestion(id){
  const text=document.getElementById('qText').value.trim();
  if(!text){toast('Напишите вопрос',true);return;}
  const all=[...products,...(myprod[session]||[])];
  const p=all.find(x=>x.id===id);if(!p)return;
  p.questions=p.questions||[];
  const autoA=pick(A_TEXTS,p.questions.length+1);
  p.questions.unshift({q:text,a:autoA,who:p.seller||'Продавец'});
  save('zuno_products',products);
  if(myprod[session]){save(LS.myprod,myprod);}
  closeModal();openProduct(id);toast('Вопрос отправлен');
}

/* ================= КОРЗИНА ================= */
function addToCart(id){
  const all=[...products,...(myprod[session]||[])];
  const p=all.find(x=>x.id===id);if(!p)return;
  const key=`${p.seller||'Zuno'}:${p.id}`;
  if(!cart[key])cart[key]={...p,qty:0,key};
  cart[key].qty++;
  save(LS.cart,cart);
  renderCart();renderBottomNav();
  toast(`«${p.name}» в корзине`);
}
function changeQty(key,d){
  if(!cart[key])return;
  cart[key].qty+=d;
  if(cart[key].qty<=0)delete cart[key];
  save(LS.cart,cart);renderCart();renderBottomNav();
}
function cartArr(){return Object.values(cart);}
function cartSum(){return cartArr().reduce((s,i)=>s+i.price*i.qty,0);}

function renderCart(){
  const arr=cartArr();
  const list=document.getElementById('cartList');
  const old=document.querySelector('.cart-bar');if(old)old.remove();
  if(!arr.length){
    list.innerHTML=`<div class="empty"><svg><use href="#i-cart"/></svg><p>Корзина пуста</p></div>`;
    return;
  }
  list.innerHTML=arr.map(i=>`
    <div class="cart-item">
      <div class="ci-img">${i.img?`<img src="${i.img}" alt="">`:`<svg><use href="#${i.icon}"/></svg>`}</div>
      <div class="ci-info">
        <h4>${i.name}</h4>
        <div class="ci-price">${(i.price*i.qty).toLocaleString('ru')} ₽</div>
      </div>
      <div class="ci-actions">
        <div class="qty">
          <button onclick="changeQty('${i.key}',-1)"><svg class="ic" style="width:14px;height:14px"><use href="#i-min"/></svg></button>
          <span>${i.qty}</span>
          <button onclick="changeQty('${i.key}',1)"><svg class="ic" style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
        </div>
      </div>
    </div>`).join('');
  const bar=document.createElement('div');
  bar.className='cart-bar';
  bar.innerHTML=`<div class="sum">Итого<b>${cartSum().toLocaleString('ru')} ₽</b></div>
    <button class="btn" onclick="openPay()">Оплатить</button>`;
  document.body.appendChild(bar);
  if(activeTabNow()!=='cart')bar.classList.add('hidden');
}
function updateCartBarVisibility(){
  const bar=document.querySelector('.cart-bar');
  if(!bar)return;
  bar.classList.toggle('hidden',activeTabNow()!=='cart');
}

/* ================= ОПЛАТА ================= */
function openPay(){
  if(!cartArr().length)return;
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>Оплата</h3>
    <div class="pay-card">
      <div class="lbl">ZUNO PAY</div>
      <div class="num" id="cardNum">•••• •••• •••• ••••</div>
      <div class="row2"><span id="cardName">CARD HOLDER</span><span id="cardExp">MM/YY</span></div>
    </div>
    <div class="field"><label>Номер карты</label><input id="payNum" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19"></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>Срок</label><input id="payExp" placeholder="ММ/ГГ" maxlength="5"></div>
      <div class="field" style="flex:1"><label>CVC</label><input id="payCvc" inputmode="numeric" placeholder="123" maxlength="4" type="password"></div>
    </div>
    <div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--muted)">
      К оплате: <b style="color:var(--green);font-size:16px">${cartSum().toLocaleString('ru')} ₽</b>
    </div>
    <button class="btn" id="payBtn" onclick="confirmPay()" disabled style="opacity:.5">Оплатить ${cartSum().toLocaleString('ru')} ₽</button>
  `);
  const num=document.getElementById('payNum');
  const exp=document.getElementById('payExp');
  const cvc=document.getElementById('payCvc');
  const btn=document.getElementById('payBtn');
  function check(){
    const ok=num.value.replace(/\s/g,'').length>=16 && /^\d{2}\/\d{2}$/.test(exp.value) && cvc.value.length>=3;
    btn.disabled=!ok;btn.style.opacity=ok?'1':'.5';
  }
  num.addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19);
    document.getElementById('cardNum').textContent=e.target.value||'•••• •••• •••• ••••';
    check();
  });
  exp.addEventListener('input',e=>{
    let v=e.target.value.replace(/\D/g,'').slice(0,4);
    if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);
    e.target.value=v;
    document.getElementById('cardExp').textContent=v||'MM/YY';
    check();
  });
  cvc.addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);check();
  });
}
function confirmPay(){
  const total=cartSum();
  const order={
    id:'ZN-'+Date.now().toString().slice(-8),
    date:new Date().toLocaleString('ru'),
    items:cartArr().map(i=>({name:i.name,price:i.price,qty:i.qty,img:i.img,icon:i.icon})),
    total,status:'Оплачен'
  };
  if(!orders[session])orders[session]=[];
  orders[session].unshift(order);save(LS.orders,orders);
  cart={};save(LS.cart,cart);
  renderCart();renderBottomNav();renderProfile();closeModal();
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <div style="text-align:center;padding:16px 0">
      <svg style="width:76px;height:76px;stroke:var(--green);fill:none;stroke-width:1.5"><use href="#i-check"/></svg>
      <h3 style="margin:14px 0 6px;justify-content:center">Заказ оформлен</h3>
      <p style="color:var(--muted);font-size:14px">Номер ${order.id} · ${total.toLocaleString('ru')} ₽</p>
      <button class="btn" style="margin-top:16px" onclick="closeModal();showTab('orders')">Мои заказы</button>
    </div>`);
 }
 /* ================= ИЗБРАННОЕ ================= */
function toggleFav(id){
  if(!fav[session])fav[session]=[];
  const i=fav[session].indexOf(id);
  if(i>=0)fav[session].splice(i,1);else fav[session].push(id);
  save(LS.fav,fav);
  renderBottomNav();
  if(activeTabNow()==='product')openProduct(id);
  else if(activeTabNow()==='fav')renderFav();
  else toast(i>=0?'Убрано из избранного':'Добавлено в избранное');
}

/* ================= ПРОФИЛЬ ================= */
function renderProfile(){
  document.getElementById('avatar').textContent=session[0].toUpperCase();
  document.getElementById('pName').textContent=session;
  document.getElementById('pEmail').textContent=users[session].email;
  document.getElementById('pBalance').textContent=(balance[session]||0).toLocaleString('ru')+' ₽';
  const favCnt=(fav[session]||[]).length;
  document.getElementById('profileMenu').innerHTML=`
    <div class="pm-row" onclick="topUp()">
      <div class="pm-ic"><svg class="ic"><use href="#i-wallet"/></svg></div>
      <div class="pm-txt">Пополнить баланс</div>
      <svg class="ic pm-arrow"><use href="#i-right"/></svg>
    </div>
    <div class="pm-row" onclick="showTab('orders')">
      <div class="pm-ic"><svg class="ic"><use href="#i-box"/></svg></div>
      <div class="pm-txt">Мои заказы</div>
      <svg class="ic pm-arrow"><use href="#i-right"/></svg>
    </div>
    <div class="pm-row" onclick="showTab('fav')">
      <div class="pm-ic"><svg class="ic"><use href="#i-heart"/></svg></div>
      <div class="pm-txt">Избранное ${favCnt?'· '+favCnt:''}</div>
      <svg class="ic pm-arrow"><use href="#i-right"/></svg>
    </div>
    <div class="pm-row" onclick="showTab('myprod')">
      <div class="pm-ic"><svg class="ic"><use href="#i-tag"/></svg></div>
      <div class="pm-txt">Мои товары</div>
      <svg class="ic pm-arrow"><use href="#i-right"/></svg>
    </div>
    <div class="pm-row" onclick="showTab('addprod')">
      <div class="pm-ic"><svg class="ic"><use href="#i-plus"/></svg></div>
      <div class="pm-txt">Добавить товар</div>
      <svg class="ic pm-arrow"><use href="#i-right"/></svg>
    </div>
    <div class="pm-row" onclick="logout()">
      <div class="pm-ic"><svg class="ic"><use href="#i-door"/></svg></div>
      <div class="pm-txt">Выйти</div>
      <svg class="ic pm-arrow"><use href="#i-right"/></svg>
    </div>`;
  renderOrders();
  renderMyProd();
}

function topUp(){
  showModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>Пополнить баланс</h3>
    <div class="field"><label>Сумма</label><input id="topSum" type="number" value="5000" min="1"></div>
    <div class="field"><label>Номер карты</label><input id="topNum" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19"></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>Срок</label><input id="topExp" placeholder="ММ/ГГ" maxlength="5"></div>
      <div class="field" style="flex:1"><label>CVC</label><input id="topCvc" inputmode="numeric" placeholder="123" maxlength="4" type="password"></div>
    </div>
    <button class="btn" onclick="doTopUp()">Пополнить</button>
  `);
  const n=document.getElementById('topNum');
  n.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19)});
  const ex=document.getElementById('topExp');
  ex.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v});
  const cv=document.getElementById('topCvc');
  cv.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
}
function doTopUp(){
  const s=+document.getElementById('topSum').value;
  if(!s||s<=0){toast('Введите сумму',true);return;}
  balance[session]=(balance[session]||0)+s;save(LS.balance,balance);
  renderProfile();closeModal();toast(`Баланс пополнен на ${s.toLocaleString('ru')} ₽`);
}

function renderOrders(){
  const arr=orders[session]||[];
  const box=document.getElementById('ordersList');
  if(!box)return;
  box.innerHTML=arr.length?arr.map(o=>`
    <div class="order">
      <div class="order-head"><span>${o.id} · ${o.date}</span><span class="status">${o.status}</span></div>
      <ul>${o.items.map(i=>`<li>${i.name} × ${i.qty} — ${(i.price*i.qty).toLocaleString('ru')} ₽</li>`).join('')}</ul>
      <div class="sum">Итого: ${o.total.toLocaleString('ru')} ₽</div>
    </div>`).join(''):`<div class="empty"><svg><use href="#i-box"/></svg><p>Заказов пока нет</p></div>`;
}

function renderMyProd(){
  const arr=myprod[session]||[];
  const box=document.getElementById('myprodList');
  if(!box)return;
  box.innerHTML=arr.length?`<div class="grid">${arr.map(p=>`
    <div class="prod" onclick="openProduct(${p.id})">
      <div class="img">${productImgBlock(p)}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price-row"><span class="price">${p.price.toLocaleString('ru')} ₽</span>${p.old?`<span class="old">${p.old.toLocaleString('ru')} ₽</span>`:''}</div>
        <span class="rate"><svg class="ic" style="width:11px;height:11px"><use href="#i-star"/></svg>${p.rate} · ${(p.reviews||[]).length} отз.</span>
      </div>
    </div>`).join('')}</div>`:`<div class="empty"><svg><use href="#i-tag"/></svg><p>Вы ещё ничего не выставили</p></div>`;
}

function renderFav(){
  const box=document.getElementById('favList');
  if(!box)return;
  const all=[...products,...(myprod[session]||[])];
  const ids=fav[session]||[];
  const list=ids.map(id=>all.find(p=>p.id===id)).filter(Boolean);
  box.innerHTML=list.length?`<div class="grid">${list.map(p=>`
    <div class="prod" onclick="openProduct(${p.id})">
      <div class="img">${productImgBlock(p)}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price-row"><span class="price">${p.price.toLocaleString('ru')} ₽</span>${p.old?`<span class="old">${p.old.toLocaleString('ru')} ₽</span>`:''}</div>
        <div class="bottom">
          <span class="rate"><svg class="ic" style="width:11px;height:11px"><use href="#i-star"/></svg>${p.rate}</span>
          <button class="btn-cart" onclick="event.stopPropagation();addToCart(${p.id})"><svg class="ic" style="width:14px;height:14px"><use href="#i-cart"/></svg>В корзину</button>
        </div>
      </div>
    </div>`).join('')}</div>`:`<div class="empty"><svg><use href="#i-heart"/></svg><p>В избранном пусто</p></div>`;
}

function addMyProd(){
  const name=document.getElementById('npName').value.trim();
  const cat=document.getElementById('npCat').value;
  const img=document.getElementById('npImg').value.trim();
  const desc=document.getElementById('npDesc').value.trim()||`${name} в категории «${cat}».`;
  const price=+document.getElementById('npPrice').value;
  const old=+document.getElementById('npOld').value||0;
  if(name.length<3){toast('Название минимум 3 символа',true);return;}
  if(!price||price<=0){toast('Укажите цену',true);return;}
  if(!myprod[session])myprod[session]=[];
  const id=Date.now();
  myprod[session].unshift({
    id,cat,name,desc,icon:CAT_ICON[cat],img,price,old,
    rate:5,sales:0,seller:session,reviews:[],questions:[]
  });
  save(LS.myprod,myprod);
  document.getElementById('npName').value='';
  document.getElementById('npImg').value='';
  document.getElementById('npDesc').value='';
  document.getElementById('npPrice').value='';
  document.getElementById('npOld').value='';
  renderMyProd();renderCatalog();
  showTab('myprod');
  toast('Товар выставлен на продажу');
}

/* ================= НАВИГАЦИЯ ================= */
function showTab(t){
  if(t!=='product' && t!=='orders' && t!=='myprod' && t!=='addprod'){
    prevTab=t;
  }
  ['catalog','cart','profile','orders','myprod','addprod','product'].forEach(x=>{
    const el=document.getElementById('tab-'+x);
    if(el)el.classList.toggle('hidden',x!==t);
  });
  if(t==='fav'){
    ['catalog','cart','profile','orders','myprod','addprod','product'].forEach(x=>{
      const el=document.getElementById('tab-'+x);if(el)el.classList.add('hidden');
    });
    if(!document.getElementById('tab-fav')){
      const s=document.createElement('section');
      s.id='tab-fav';
      s.innerHTML=`<h2 style="font-size:20px;margin-bottom:14px">Избранное</h2><div id="favList"></div>`;
      document.querySelector('main').appendChild(s);
    }
    document.getElementById('tab-fav').classList.remove('hidden');
    renderFav();
  } else if(document.getElementById('tab-fav')){
    document.getElementById('tab-fav').classList.add('hidden');
  }
  renderBottomNav();
  updateCartBarVisibility();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ================= МОДАЛКА / ТОСТ ================= */
function showModal(html){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

let toastTimer;
function toast(msg,warn){
  const el=document.getElementById('toast');
  document.getElementById('toastTxt').textContent=msg;
  el.classList.toggle('warn',!!warn);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ================= СТАРТ ================= */
if(session&&users[session]){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}
</script>
